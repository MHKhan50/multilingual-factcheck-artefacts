[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civintel-agentbench"
version = "0.3.0"
description = "Multilingual evidence-grounded claim verification and conflict-report analysis with abstention."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muzammal Hussain"}]
dependencies = [
  "pandas>=1.5,<3.0",
  "numpy>=1.23,<3.0",
  "scikit-learn>=1.1,<2.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<9.0", "ruff>=0.4,<1.0"]

[project.scripts]
civintel = "civintel_agentbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
